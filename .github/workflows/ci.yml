name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: node --test services/*.test.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      # El lint tiene errores previos (react-hooks); se informa pero no bloquea
      # hasta que se corrijan.
      - name: Lint (informativo)
        run: npm run lint
        continue-on-error: true
